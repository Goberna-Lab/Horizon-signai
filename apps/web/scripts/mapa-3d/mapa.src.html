<!-- Títulos y nombres en Archivo autoalojada (antes Cormorant Garamond): apps/web/public/ui/display-caps.css -->
<link rel="stylesheet" href="/ui/display-caps.css">
<style>
:root {
  --paper: #F4EFE6; --paper-2: #ECE5D9; --ink: #161412; --ink-2: #5E574E; --rule: #D8D0C3;
  --red: #C8102E; --mon: #0E0D0C; --mon-2: #1C1B19; --mon-rule: #36322D; --mon-fg: #F4EFE6; --mon-fg-2: #A39B8F;
  --c-tripulada: #E0263F; --c-robotica: #F4EFE6; --c-muestras: #E3B24F; --c-rover: #86BFA9; --c-impacto: #8C857B; --c-candidata: #E8893A;
  --font-display: "Archivo Variable", "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Jost", "Avenir Next", "Century Gothic", system-ui, sans-serif;
  --s--1: clamp(0.74rem, 0.72rem + 0.1vw, 0.8rem); --s-0: clamp(0.86rem, 0.84rem + 0.12vw, 0.94rem);
  --s-1: clamp(1rem, 0.96rem + 0.2vw, 1.12rem); --s-3: clamp(1.5rem, 1.3rem + 0.9vw, 2rem);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--mon); color: var(--ink); font: 400 var(--s-0)/1.45 var(--font-body); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; height: 100%; }

/* ---------- Panel (papel) ---------- */
#panel { background: var(--paper); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--mon-rule); }
.cab { padding: 18px 20px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.sol { width: 22px; height: 22px; border-radius: 50%; background: var(--red); }
.cab h1 { margin: 0; font: 600 var(--s-3)/1 var(--font-display); letter-spacing: -0.03em; }
.cab small { display: block; color: var(--ink-2); font-size: var(--s--1); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
.bloque { padding: 10px 20px; }
.bloque + .bloque { border-top: 1px solid var(--rule); }
.rotulo { font-size: var(--s--1); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); margin: 0 0 6px; display: flex; justify-content: space-between; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--paper-2); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 6px 4px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#buscar { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: #FBF8F2; }
#buscar:focus-visible, select:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: #FBF8F2; padding: 4px 9px 4px 7px; border-radius: 999px; cursor: pointer; font-size: var(--s--1); color: var(--ink); }
.chip[aria-pressed="false"] { opacity: 0.45; background: transparent; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset; }
.chip b { font-weight: 600; color: var(--ink-2); }
.fila { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
select { width: 100%; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: #FBF8F2; }
input[type=range] { width: 100%; accent-color: var(--red); }
#lista { flex: 1; overflow: auto; min-height: 120px; padding: 4px 8px 8px; margin: 0; list-style: none; border-top: 1px solid var(--rule); }
#lista li button { width: 100%; display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
#lista li button:hover { background: var(--paper-2); }
#lista li button[aria-current="true"] { background: var(--ink); color: var(--paper); }
#lista li button[aria-current="true"] .meta { color: var(--mon-fg-2); }
#lista .punto { width: 10px; height: 10px; border-radius: 50%; align-self: center; box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset; }
#lista .nom { font-weight: 500; }
#lista .meta { color: var(--ink-2); font-size: var(--s--1); white-space: nowrap; }
#lista .vacio { padding: 16px 12px; color: var(--ink-2); }
details.fuentes { padding: 10px 20px 14px; border-top: 1px solid var(--rule); font-size: var(--s--1); color: var(--ink-2); }
details.fuentes summary { cursor: pointer; color: var(--ink); }
details.fuentes ul { padding-left: 16px; margin: 8px 0 0; }
details.fuentes a { color: var(--ink); }

/* ---------- Escena ---------- */
#escena { position: relative; min-width: 0; min-height: 0; background: radial-gradient(ellipse at 60% 40%, #1a1816 0%, var(--mon) 70%); }
#lienzo { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
#marcas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.m { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; transform: translate(-50%, -50%); width: 18px; height: 18px; display: grid; place-items: center; }
.m::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px rgba(14,13,12,0.85); }
.m.impacto::before { width: 9px; height: 9px; border-radius: 0; background: none; box-shadow: none;
  background: linear-gradient(45deg, transparent 42%, var(--c) 42%, var(--c) 58%, transparent 58%), linear-gradient(-45deg, transparent 42%, var(--c) 42%, var(--c) 58%, transparent 58%); }
.m.candidata::before { border-radius: 2px; transform: rotate(45deg); background: transparent; box-shadow: 0 0 0 2px var(--c), 0 0 0 3.5px rgba(14,13,12,0.85); width: 7px; height: 7px; }
.m.sel::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--red); animation: pulso 1.8s ease-out infinite; }
@keyframes pulso { from { transform: scale(0.7); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.m span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); white-space: nowrap; color: var(--mon-fg); font-size: var(--s--1); font-weight: 500;
  text-shadow: 0 0 3px #000, 0 0 6px #000; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
.m.rot span, .m:hover span, .m.sel span { opacity: 1; }
.m.propio::before { background: var(--red); border-radius: 0; width: 2px; height: 14px; box-shadow: none; }
.m.propio::after { content: ""; position: absolute; width: 14px; height: 2px; background: var(--red); }

.hud { position: absolute; color: var(--mon-fg); font-size: var(--s--1); }
.vista-sup { top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.vista-sup > * { pointer-events: auto; }
.estado { background: rgba(14,13,12,0.72); border: 1px solid var(--mon-rule); border-radius: 10px; padding: 8px 12px; max-width: 46ch; }
.estado strong { font-weight: 600; }
.estado .gris { color: var(--mon-fg-2); }
.ctrl { background: rgba(14,13,12,0.78); border: 1px solid var(--mon-rule); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; min-width: 230px; }
.ctrl label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; color: var(--mon-fg-2); }
.ctrl label input { grid-column: 1 / -1; }
.ctrl output { color: var(--mon-fg); font-variant-numeric: tabular-nums; }
.seg.osc { background: var(--mon-2); }
.seg.osc button { color: var(--mon-fg-2); padding: 4px 6px; font-size: var(--s--1); }
.seg.osc button[aria-pressed="true"] { background: var(--mon-fg); color: var(--ink); }
.leyenda { display: grid; gap: 4px; }
.barra { height: 8px; border-radius: 4px; }
.leyenda .esc { display: flex; justify-content: space-between; color: var(--mon-fg-2); font-variant-numeric: tabular-nums; }

.tiempo { left: 16px; right: 16px; bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: rgba(14,13,12,0.78); border: 1px solid var(--mon-rule); border-radius: 12px; padding: 8px 12px; }
.tiempo input[type=datetime-local] { background: var(--mon-2); border: 1px solid var(--mon-rule); border-radius: 8px; padding: 4px 8px; color: var(--mon-fg); color-scheme: dark; }
.tiempo .play { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--red); color: var(--paper); cursor: pointer; font-size: 14px; }
.tiempo .gris { color: var(--mon-fg-2); }
.tiempo .num { font-variant-numeric: tabular-nums; }
.tiempo .esp { flex: 1; }

#ficha { position: absolute; right: 16px; bottom: 76px; width: min(360px, calc(100% - 32px)); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 16px 18px 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45); display: none; max-height: calc(100% - 290px); min-height: 0; overflow: auto; }
#ficha.vis { display: block; animation: entra 0.22s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
#ficha h2 { margin: 0 28px 2px 0; font: 600 var(--s-3)/1.05 var(--font-display); letter-spacing: -0.03em; }
#ficha .sub { color: var(--ink-2); font-size: var(--s--1); text-transform: uppercase; letter-spacing: 0.07em; display: flex; gap: 8px; align-items: center; }
#ficha .sub i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset; }
#ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 12px 0 10px; }
#ficha dt { color: var(--ink-2); }
#ficha dd { margin: 0; font-variant-numeric: tabular-nums; }
#ficha dd small { color: var(--ink-2); }
#ficha p { margin: 8px 0; }
#ficha .nota { font-size: var(--s--1); color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 8px; }
#ficha .cerrar { position: absolute; right: 10px; top: 10px; border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 4px 6px; }
#ficha .acciones { display: flex; gap: 8px; margin-top: 10px; }
#ficha .acciones button { border: 1px solid var(--ink); background: none; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: var(--s--1); }
#ficha .acciones button.prim { background: var(--ink); color: var(--paper); }
.si { color: #1f7a4d; font-weight: 600; } .no { color: var(--red); font-weight: 600; }
.aprox { display: inline-block; font-size: 0.72rem; border: 1px solid var(--ink-2); color: var(--ink-2); border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }

#carga { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mon-fg-2); font-size: var(--s-1); background: var(--mon); z-index: 5; }
#carga .sol { width: 46px; height: 46px; margin: 0 auto 14px; animation: late 1.4s ease-in-out infinite; }
@keyframes late { 50% { transform: scale(0.82); opacity: 0.6; } }
#abrirPanel { display: none; }
.iau { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; transform: translate(-50%, -50%);
  font-family: var(--font-display); font-style: italic; font-weight: 600; color: #EFE6D3; letter-spacing: -0.03em;
  text-shadow: 0 0 2px #0E0D0C, 0 0 5px #0E0D0C, 0 0 9px rgba(14,13,12,0.8); line-height: 1; }
.iau.sat { font-weight: 500; color: #CFC5B3; }
.iau.mar { font-style: normal; font-family: var(--font-body); font-weight: 500; text-transform: uppercase; letter-spacing: 0.22em; color: #E8C98F; }
.iau:hover, .iau.sel { color: #FFFDF8; text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 3px; }
.tog { border: 1px solid var(--mon-rule); background: var(--mon-2); color: var(--mon-fg-2); border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: var(--s--1);
  display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tog[aria-pressed="true"] { color: var(--mon-fg); border-color: #8a7f6c; }
.tog[aria-pressed="true"] em { color: #E8C98F; }
.tog em { font-style: normal; font-variant-numeric: tabular-nums; }
#ficha a { color: var(--ink); }

/* ---------- Tooltips: estrella fugaz ---------- */
#tip { position: fixed; z-index: 20; left: 0; top: 0; width: min(290px, calc(100vw - 24px)); pointer-events: none;
  color: var(--mon-fg); font-size: var(--s--1); line-height: 1.45; opacity: 0; visibility: hidden; }
#tip .carta { position: relative; border-radius: 12px; padding: 12px 14px 12px; border: 1px solid rgba(232,201,143,0.32);
  background:
    radial-gradient(1px 1px at 18% 22%, rgba(255,250,235,0.85), transparent 60%),
    radial-gradient(1px 1px at 72% 14%, rgba(255,250,235,0.6), transparent 60%),
    radial-gradient(1.2px 1.2px at 88% 64%, rgba(255,250,235,0.7), transparent 60%),
    radial-gradient(1px 1px at 41% 82%, rgba(255,250,235,0.5), transparent 60%),
    radial-gradient(0.8px 0.8px at 60% 48%, rgba(255,250,235,0.45), transparent 60%),
    linear-gradient(160deg, #1B1915 0%, #0F0E0C 100%);
  box-shadow: 0 14px 34px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.03); }
#tip strong { display: block; font: italic 600 1.18rem/1.1 var(--font-display); color: #E8C98F; margin-bottom: 4px; letter-spacing: -0.03em; }
#tip p { margin: 0; color: #DCD3C3; }
#tip .mejor { margin-top: 8px; padding-top: 7px; border-top: 1px dashed rgba(232,201,143,0.28); color: var(--mon-fg); }
#tip .mejor b { color: #E8C98F; font-weight: 600; }
#tip .ahora { margin-top: 6px; color: var(--mon-fg-2); font-variant-numeric: tabular-nums; }
/* la estela cruza en diagonal y la cabeza se queda como estrella en la esquina */
#tip .estela { position: absolute; left: 2px; top: 2px; width: 150px; height: 2px; transform-origin: 100% 50%;
  background: linear-gradient(90deg, transparent, rgba(232,201,143,0.15) 30%, rgba(255,246,222,0.95)); border-radius: 2px;
  transform: translate(-100%, -50%) rotate(28deg); opacity: 0; filter: drop-shadow(0 0 4px rgba(255,236,190,0.7)); }
#tip .astro { position: absolute; left: 2px; top: 2px; width: 7px; height: 7px; transform: translate(-50%, -50%); border-radius: 50%;
  background: #FFF8E6; box-shadow: 0 0 6px 2px rgba(255,236,190,0.85), 0 0 16px 4px rgba(232,201,143,0.35); opacity: 0; }
#tip .astro::before, #tip .astro::after { content: ""; position: absolute; left: 50%; top: 50%; background: linear-gradient(90deg, transparent, #FFF8E6, transparent);
  width: 22px; height: 1px; transform: translate(-50%, -50%); }
#tip .astro::after { transform: translate(-50%, -50%) rotate(90deg); }
#tip.vis { visibility: visible; animation: tipEntra 0.32s 0.34s ease-out both; }
#tip.vis .estela { animation: estela 0.62s cubic-bezier(.2,.7,.3,1) both; }
#tip.vis .astro { animation: llega 0.62s cubic-bezier(.2,.7,.3,1) both, titila 2.4s 0.9s ease-in-out infinite; }
@keyframes estela {
  0% { opacity: 0; transform: translate(-100%, -50%) rotate(28deg) translateX(-150px); }
  25% { opacity: 1; }
  70% { opacity: 1; transform: translate(-100%, -50%) rotate(28deg) translateX(0); }
  100% { opacity: 0; transform: translate(-100%, -50%) rotate(28deg) translateX(0) scaleX(0.2); }
}
@keyframes llega { 0% { opacity: 0; } 60% { opacity: 0; } 72% { opacity: 1; transform: translate(-50%, -50%) scale(1.6); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes titila { 50% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.8) rotate(45deg); } }
@keyframes tipEntra { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
[data-tip] { position: relative; }
.ctrl label[data-tip] > span::after, .tog[data-tip] > span::after { content: "✦"; margin-left: 5px; font-size: 0.7em; color: rgba(232,201,143,0.7); }
@media (prefers-reduced-motion: reduce) {
  #tip.vis, #tip.vis .estela, #tip.vis .astro { animation: none; }
  #tip.vis { opacity: 1; } #tip.vis .astro { opacity: 1; } #tip .estela { display: none; }
}
.estrecha #ficha { left: 12px; right: 12px; width: auto; max-height: 42%; padding: 12px 14px 10px; }
.estrecha #ficha dl { margin: 8px 0 6px; gap: 3px 12px; }
.estrecha .tiempo { padding: 6px 10px; gap: 8px; }

@media (prefers-reduced-motion: reduce) { .m.sel::after, #carga .sol, #ficha.vis { animation: none; } }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #panel { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; max-height: 62%; border-radius: 14px 14px 0 0; transform: translateY(105%); transition: transform 0.25s; }
  #panel.abierto { transform: none; }
  #abrirPanel { display: block; position: absolute; z-index: 3; left: 16px; bottom: 76px; border: 0; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 500; }
  .vista-sup { flex-direction: column; }
  .ctrl { min-width: 0; }
  #ficha { top: auto; bottom: 120px; max-height: 45%; }
  .tiempo { left: 8px; right: 8px; bottom: 8px; }
}
</style>

<body>
<div id="app">
  <aside id="panel" aria-label="Filtros">
    <header class="cab">
      <div class="sol" aria-hidden="true"></div>
      <div><h1><a href="/" target="_top" style="color: inherit; text-decoration: none" title="Horizon Signai">Horizon Signai</a></h1><small data-t="subtitulo"></small></div>
    </header>
    <div class="bloque">
      <p class="rotulo"><span data-t="vista"></span></p>
      <div class="seg" role="group" id="vistas">
        <button data-vista="globo" data-t="globo"></button>
        <button data-vista="polo" data-t="poloSur"></button>
      </div>
    </div>
    <div class="bloque">
      <input id="buscar" type="search" autocomplete="off" data-tp="buscar">
    </div>
    <div class="bloque">
      <p class="rotulo"><span data-t="tipo"></span></p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="bloque fila">
      <div><p class="rotulo"><span data-t="agencia"></span></p><select id="agencia"></select></div>
      <div><p class="rotulo"><span data-t="hasta"></span><output id="anioV"></output></p><input id="anio" type="range" min="1959" max="2026" step="1" value="2026"></div>
    </div>
    <ul id="lista" aria-label="Misiones"></ul>
    <details class="fuentes">
      <summary data-t="fuentesT"></summary>
      <ul id="fuentes"></ul>
    </details>
  </aside>

  <main id="escena">
    <canvas id="lienzo" aria-label="Luna 3D"></canvas>
    <div id="marcas"></div>
    <div class="hud vista-sup">
      <div class="estado" id="estado"></div>
      <div class="ctrl">
        <div class="seg osc" role="group" id="colores">
          <button data-color="albedo" data-t="cAlbedo"></button>
          <button data-color="altura" data-t="cAltura"></button>
          <button data-color="pendiente" data-t="cPendiente"></button>
        </div>
        <div class="leyenda" id="leyenda"></div>
        <label><span data-t="exag"></span><output id="exagV"></output><input id="exag" type="range" min="1" max="20" step="1" value="6"></label>
        <button class="tog" id="iau" aria-pressed="true"><span data-t="capaIAU"></span><em id="iauN"></em></button>
        <div class="seg osc" role="group" id="luces">
          <button data-luz="sol" data-t="luzSol"></button>
          <button data-luz="camara" data-t="luzCam"></button>
        </div>
      </div>
    </div>
    <div class="hud tiempo">
      <button class="play" id="play" aria-label="Play">▶</button>
      <input type="datetime-local" id="fecha" step="3600">
      <span class="gris">UTC</span>
      <div class="seg osc" role="group" id="velocidad" style="width:auto">
        <button data-vel="3600">1 h/s</button><button data-vel="21600">6 h/s</button><button data-vel="86400" data-t="diaS"></button>
      </div>
      <span class="esp"></span>
      <span class="num" id="subsolar"></span>
    </div>
    <article id="ficha" aria-live="polite"></article>
    <button id="abrirPanel" data-t="filtros"></button>
    <div id="carga"><div><div class="sol"></div><span data-t="cargando"></span></div></div>
  </main>
</div>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three' // el módulo empaquetado ya incluye OrbitControls

// Los datos viven en PostgreSQL (db/) y llegan por /api/map3d. Se reconstruye el mismo objeto que antes iba embebido.
// La API incrusta el manifiesto (el mismo objeto que /api/map3d/meta, con las URLs versionadas) en el HTML y precarga los
// archivos del primer dibujo; sin manifiesto (base caída, plantilla estática) se pide /meta como antes.
async function cargarDatos() {

  try { meta = JSON.parse(document.getElementById('map3d-manifest')?.textContent || 'null') } catch (e) { console.warn(e) }
  meta ??= await (await api('/api/map3d/meta')).json()

  const imagen = (u) => {
    const p = (async () => { const img = new Image(); img.src = u; await img.decode(); return img })()
    p.catch(() => {}) // el error se informa donde se espera

    .then(([sites, iau, horizons]) => ({ sites, iau, horizons }))

  const paquete = meta.dataUrl
    ? api(meta.dataUrl).then((r) => new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json()).catch((e) => { console.warn(e); return sueltos() })
    : sueltos()

    bin('global_elevation'), bin('global_albedo'), bin('ephemeris_de441'), paquete,

      sitios: sitios.sites.map((x) => ({
        id: x.slug, nombre: x.name, cat: cat(x.cat), agencia: x.agency, pais: x.country, fecha: x.date, lat: x.lat, lon: x.lon,
        region: x.region, es: x.description, en: x.description, src: x.source, aprox: x.approx, artemis: x.artemis,

  const dist = camera.position.distanceTo(controls.target)
  let radio = Math.min(Math.max(dist * 1.4, 40), R + 25)
  if (radio > R * 0.7) { radio = R + 25; _c.set(0, 0, 0) } else _c.copy(controls.target)
  let dir
  if (modoLuz === 'sol') dir = dirSol
  else { // luz de estudio: desde arriba a la izquierda de la cámara
    _v.copy(camera.position).sub(controls.target).normalize()
    const der = new THREE.Vector3().crossVectors(camera.up, _v).normalize()
    dir = _v.clone().multiplyScalar(0.55).addScaledVector(der, -0.65).addScaledVector(camera.up, 0.5).normalize()
  }
  sol.position.copy(_c).addScaledVector(dir, radio * 2)
  sol.target.position.copy(_c)
  const sc = sol.shadow.camera
  sc.left = sc.bottom = -radio; sc.right = sc.top = radio; sc.near = radio * 0.2; sc.far = radio * 3.8
  sc.updateProjectionMatrix()
  sol.shadow.normalBias = radio / TAM_SOMBRA * 1.2
  ambiente.intensity = modoLuz === 'sol' ? 0.05 : 0.22
  tierra.visible = discoSol.visible = modoLuz === 'sol'
  tierra.position.copy(camera.position).addScaledVector(dirTierra, DIST_CIELO)
  if (tierra.visible) orientarTierra(ahoraMs)
  discoSol.position.copy(camera.position).addScaledVector(dirSol, DIST_CIELO)
}

// Sombra del relieve: marcha desde el punto hacia el cuerpo con alturas reales (sin exageración).
function bloqueado(lat, lon, dir) {
  const h0 = alturaFina(lat, lon).h
  const p = unit(lat, lon).multiplyScalar(R + h0 + 0.002)
  const q = new THREE.Vector3()
  for (let s = 0.12; s < 400; s *= 1.035) {
    q.copy(p).addScaledVector(dir, s)
    const r = q.length()
    if (r - R > 11) return false
    const [la, lo] = deVector(q)
    if (r < R + alturaFina(la, lo).h) return true
  }
  return false
}
/**
 * Sol y Tierra vistos desde (lat, lon). Desde un punto alto el horizonte baja: con altura h sobre la esfera de referencia,
 * se ve hasta acos(R / (R + h)) bajo la horizontal (4,4° en la cumbre de Malapert, a 5,2 km). Por encima de ese límite
 * decide el relieve (marcha del rayo con alturas reales).
 */

function cielo(lat, lon, idSitio) {
  const up = unit(lat, lon)
  const elS = Math.asin(up.dot(dirSol)) / RAD, elT = Math.asin(up.dot(dirTierra)) / RAD
  const hz = idSitio && HZ5[idSitio]
  if (hz) {
    // Horizonte medido con el DTM de 5 m: visible si el centro del cuerpo está por encima del horizonte en su azimut.
    const este = new THREE.Vector3(-Math.sin(lon * RAD), 0, -Math.cos(lon * RAD))
    const norte = new THREE.Vector3(-Math.sin(lat * RAD) * Math.cos(lon * RAD), Math.cos(lat * RAD), Math.sin(lat * RAD) * Math.sin(lon * RAD))
    const enHz = (d) => { const az = ((Math.atan2(d.dot(este), d.dot(norte)) / RAD) + 360) % 360, x = az / 0.5, i = Math.floor(x) % 720, u = x - Math.floor(x); return hz[i] * (1 - u) + hz[(i + 1) % 720] * u }
    return { elS, elT, metodo: 'hz5', solBajo: false, tierraBajo: false, solTapado: elS <= enHz(dirSol), tierraTapada: elT <= enHz(dirTierra) }
  }
  const dip = Math.acos(R / (R + Math.max(alturaFina(lat, lon).h, 0))) / RAD
  const solBajo = elS < -dip, tierraBajo = elT < -dip
  const a = alturaFina(lat, lon)
  return { elS, elT, dip, solBajo, tierraBajo, metodo: a.fino ? 'dem240' : a.polo ? 'dem663' : 'demG',
    solTapado: !solBajo && bloqueado(lat, lon, dirSol), tierraTapada: !tierraBajo && bloqueado(lat, lon, dirTierra) }
}

let claveAnillos = ''
function dibujarAnillos(lista) {
  const clave = lista.map((f) => f.id).join(',') + '|' + exag
  if (clave === claveAnillos) return
  claveAnillos = clave
  const SEG = 64, pos = new Float32Array(lista.length * SEG * 6)
  let k = 0
  for (const f of lista) {
    const c = unit(f.lat, f.lon), ang = (f.d / 2) / R
    const e1 = new THREE.Vector3(0, 1, 0).cross(c); if (e1.lengthSq() < 1e-8) e1.set(1, 0, 0); e1.normalize()
    const e2 = new THREE.Vector3().crossVectors(c, e1)
    const pt = (i) => {
      const th = (i / SEG) * Math.PI * 2
      const v = c.clone().multiplyScalar(Math.cos(ang)).addScaledVector(e1, Math.sin(ang) * Math.cos(th)).addScaledVector(e2, Math.sin(ang) * Math.sin(th))
      const [la, lo] = deVector(v)
      return v.multiplyScalar(R + altura(la, lo).h * exag + 0.08 + 0.004 * f.d)
    }
    let prev = pt(0)
    for (let i = 1; i <= SEG; i++) { const cur = pt(i); pos.set([prev.x, prev.y, prev.z, cur.x, cur.y, cur.z], k); k += 6; prev = cur }
  }
  anillosGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3))
  pedir()
}
const _q = new THREE.Vector3()
function etiquetarIAU(cajas, w, h) {
  let usados = 0
  const foco = (h / 2) / Math.tan((camera.fov * RAD) / 2), conAnillo = []
  if (capaIAU) {
    for (const f of IAU) {
      if (usados >= 140) break
      _q.copy(camera.position).sub(f.pos)
      const dist = _q.length()
      if (_q.dot(f.pos) < 0.02 * dist * f.pos.length()) continue // al otro lado del globo
      const dpx = (f.d / dist) * foco
      const umbral = f.c === 'SF' ? 70 : (f.c === 'ME' || f.c === 'OC') ? 16 : 28
      if (dpx < umbral && f !== iauSel) continue
      _p.copy(f.pos).project(camera)
      if (_p.z > 1 || Math.abs(_p.x) > 1 || Math.abs(_p.y) > 1) continue
      const x = (_p.x * 0.5 + 0.5) * w, y = (-_p.y * 0.5 + 0.5) * h
      const mar = f.c === 'ME' || f.c === 'OC' || f.c === 'LC' || f.c === 'SI' || f.c === 'PA'
      const fs = mar ? Math.min(Math.max(9 + dpx / 60, 10), 15) : f.c === 'SF' ? Math.min(Math.max(9 + dpx / 60, 10), 13) : Math.min(Math.max(10 + dpx / 22, 11), 19)
      const ancho = f.n.length * fs * (mar ? 0.82 : 0.47), alto = fs * 1.1
      const caja = [x - ancho / 2 - 3, y - alto / 2, x + ancho / 2 + 3, y + alto / 2]
      if (cajas.some((o) => caja[0] < o[2] && caja[2] > o[0] && caja[1] < o[3] && caja[3] > o[1]) && f !== iauSel) continue
      cajas.push(caja)
      const el = etiquetaIAU(usados++)
      if (el._f !== f) { el._f = f; el.textContent = f.n; el.className = 'iau' + (f.c === 'SF' ? ' sat' : mar ? ' mar' : '') }
      el.classList.toggle('sel', f === iauSel)
      el.style.display = ''
      el.style.fontSize = fs.toFixed(1) + 'px'
      el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`
      if (!mar && f.c !== 'MO' && dpx > 40 && conAnillo.length < 60) conAnillo.push(f)
    }
  }
  for (let i = usados; i < poolIAU.length; i++) { poolIAU[i].style.display = 'none'; poolIAU[i]._f = null }
  if (iauSel && !conAnillo.includes(iauSel)) conAnillo.push(iauSel)

}

const visibleS = (s) => filtro.cats.has(s.cat) && (!filtro.agencia || s.agencia === filtro.agencia) && (s.anio === null || s.anio <= filtro.anio) &&
  (!filtro.texto || `${s.nombre} ${s.agencia} ${s.region} ${s.anio ?? ''}`.toLowerCase().includes(filtro.texto))
function colocarMarcas() { for (const s of SITIOS) s.pos = unit(s.lat, s.lon).multiplyScalar(R + s.h * exag + 0.05); colocarIAU() }
const _p = new THREE.Vector3(), _n = new THREE.Vector3()
function proyectarMarcas() {
  const w = lienzo.clientWidth, h = lienzo.clientHeight
  const visibles = []
  const proyectar = (pos, el) => {
    _n.copy(pos).normalize()
    _p.copy(camera.position).sub(pos)
    const frente = _n.dot(_p) > -0.02 * _p.length()
    _p.copy(pos).project(camera)
    if (!frente || _p.z > 1 || Math.abs(_p.x) > 1.05 || Math.abs(_p.y) > 1.05) { el.style.display = 'none'; return false }
    el.style.display = ''
    el.style.transform = `translate(${(_p.x * 0.5 + 0.5) * w}px, ${(-_p.y * 0.5 + 0.5) * h}px) translate(-50%, -50%)`
    return true
  }
  for (const s of SITIOS) {
    if (!visibleS(s)) { s.el.style.display = 'none'; continue }
    if (proyectar(s.pos, s.el)) { s.sx = (_p.x * 0.5 + 0.5) * w; s.sy = (-_p.y * 0.5 + 0.5) * h; visibles.push(s) }
  }
  // Puntos encimados en pantalla (p. ej., Apollo 12 y Surveyor 3, a 160 m): se abren en abanico para que cada uno
  // reciba su propio clic. Al acercarse se separan solos y vuelven a su posición real.
  // Grupos por cercanía; si al abrir un abanico un punto cae sobre otro grupo, los dos se funden y se reparte de nuevo.
  const n = visibles.length, ox = visibles.map((v) => v.sx), oy = visibles.map((v) => v.sy)
  const grupo = visibles.map((_, i) => i)
  const raiz = (i) => (grupo[i] === i ? i : (grupo[i] = raiz(grupo[i])))
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (Math.hypot(ox[i] - ox[j], oy[i] - oy[j]) < 14) grupo[raiz(j)] = raiz(i)
  for (let pasada = 0; pasada < 4; pasada++) {
    const miembros = new Map()
    for (let i = 0; i < n; i++) { const r = raiz(i); if (!miembros.has(r)) miembros.set(r, []); miembros.get(r).push(i) }
    for (const g of miembros.values()) {
      if (g.length < 2) { visibles[g[0]].sx = ox[g[0]]; visibles[g[0]].sy = oy[g[0]]; continue }
      const cx = g.reduce((a, i) => a + ox[i], 0) / g.length, cy = g.reduce((a, i) => a + oy[i], 0) / g.length, r = 8 + 2.5 * g.length
      g.forEach((i, k) => { const a = -Math.PI / 2 + (k / g.length) * 2 * Math.PI; visibles[i].sx = cx + r * Math.cos(a); visibles[i].sy = cy + r * Math.sin(a) })
    }
    let fundio = false
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      if (raiz(i) !== raiz(j) && Math.hypot(visibles[i].sx - visibles[j].sx, visibles[i].sy - visibles[j].sy) < 13) { grupo[raiz(j)] = raiz(i); fundio = true }
    }
    if (!fundio) break
  }
  for (const v of visibles) v.el.style.transform = `translate(${v.sx}px, ${v.sy}px) translate(-50%, -50%)`
  // Rótulos sin choques: primero el seleccionado y luego por tipo; si un rótulo pisa a otro, se oculta.
  const orden = ['tripulada', 'robotica', 'muestras', 'rover', 'candidata', 'impacto']
  visibles.sort((a, b) => (b === seleccion) - (a === seleccion) || orden.indexOf(a.cat) - orden.indexOf(b.cat))
  const cajas = []
  for (const s of visibles) {
    const c = [s.sx - 7, s.sy - 9, s.sx + 16 + s.nombre.length * 6.8, s.sy + 9]
    const libre = visibles.length <= 40 && !cajas.some((o) => c[0] < o[2] && c[2] > o[0] && c[1] < o[3] && c[3] > o[1])
    s.el.classList.toggle('rot', libre)
    if (libre || s === seleccion) cajas.push(c)
  }
  etiquetarIAU(cajas, w, h)
  if (propio) proyectar(propio.pos, marcaPropia); else marcaPropia.style.display = 'none'
}

let vuelo = null
function fijarArriba(up) {

}
function volarA(objetivo, posicion, up, ms = 1400) {
  controls._sphericalDelta?.set(0, 0, 0); controls._panOffset?.set(0, 0, 0); controls._scale = 1
  vuelo = { t0: performance.now(), ms, o0: controls.target.clone(), p0: camera.position.clone(), o1: objetivo, p1: posicion, up }
  fijarArriba(up)
  pedir()
}
function irGlobo(dir) {
  const d = (dir ?? camera.position.clone().normalize())

}
function irSitio(lat, lon, dist, inclin = [0.75, 0.66]) {

  const up = unit(lat, lon), h = altura(lat, lon).h

  const ref = lat < -78 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0)
  const adelante = ref.addScaledVector(up, -ref.dot(up)).normalize()
  const p = o.clone().addScaledVector(up, dist * inclin[0]).addScaledVector(adelante, -dist * inclin[1])

}

  const minimo = lat < -78 ? 4 : 40
  acercarA(lat, lon, yaAhi ? Math.max(camera.position.distanceTo(controls.target) * 0.45, minimo) : base)
}

  if (lat < -78 && vista !== 'polo') { vista = 'polo'; seg('vistas', 'vista', 'polo'); estado() }

}

    const enlaces = (s.enlaces || []).map((e) => ` · <a href="${e.url}" target="_blank" rel="noopener">${e[idioma]}</a>`).join('')
    nota = `<p>${s[idioma]}</p><p class="nota">${t('fuente')}: ${s.src}${s.aprox ? ` <span class="aprox">${t('aprox')}</span>` : ''}${enlaces}</p><p class="nota">${t('centroSol')}</p>`
    acciones = `<div class="acciones"><button class="prim" data-acc="ir">${t('ir')}</button></div>`
  } else if (f.iau) {
    const c = f.iau; lat = c.lat; lon = c.lon; iauSel = c
    cab = `<div class="sub"><i style="background:#E8C98F"></i>${t('t' + c.c)}</div><h2>${c.n}</h2>`
    extra = `<dt>${t('diam')}</dt><dd>${c.d >= 10 ? Math.round(c.d) : c.d.toFixed(1)} km</dd>${c.a ? `<dt>${t('aprobado')}</dt><dd>${c.a}</dd>` : ''}`
    nota = `${c.o ? `<p><small style="color:var(--ink-2)">${t('origen')}:</small> ${c.o}</p>` : ''}<p class="nota">IAU/USGS Gazetteer of Planetary Nomenclature · <a href="https://planetarynames.wr.usgs.gov/Feature/${c.id}" target="_blank" rel="noopener">${t('fichaIAU')} #${c.id}</a></p>`
    acciones = `<div class="acciones"><button class="prim" data-acc="ir">${t('ir')}</button></div>`
  } else {
    lat = f.lat; lon = f.lon
    cab = `<div class="sub"><i style="background:var(--red)"></i>${t('clicHint')}</div><h2>${t('tuPunto')}</h2>`
    nota = `<p class="nota">${t('centroSol')}</p>`
    acciones = `<div class="acciones"><button class="prim" data-acc="ir">${t('ir')}</button></div>`
  }
  // El planificador cubre hasta 190 km del polo sur (latitud ≤ −83,74°): ahí la ficha ofrece abrir el punto en él.
  if (lat <= LAT_PLANIFICADOR) acciones = acciones.replace('</div>', `<button data-acc="plan" title="${t('planificarT')}">${t('planificar')}</button></div>`)
  if (lat < -78 && !poloListo) { esperarPolo(() => { if (fichaActual === f) mostrarFicha(f, refrescar) }); return } // elevación y pendiente polares piden el polo
  const a = alturaFina(lat, lon), p = pendienteFina(lat, lon)
  F.innerHTML = `<button class="cerrar" aria-label="${t('quitar')}" data-acc="cerrar">×</button>${cab}
    <dl>${extra}<dt>${t('coords')}</dt><dd>${fmtLat(lat)}, ${fmtLon(lon)}</dd>
    <dt>${t('elev')}</dt><dd>${Math.round(a.h * 1000).toLocaleString(idioma)} m <small>· ${a.fino ? t('rejillaF') : a.polo ? t('rejillaP') : t('rejillaG')}</small></dd>
    <dt>${t('pend')}</dt><dd>${p.s.toFixed(1)}° <small>· ${p.fino ? t('base480') : p.polo ? t('baseP') : t('baseG')}</small></dd>
    ${f.sitio && f.sitio.h240 != null ? `<dt>LOLA 240 m</dt><dd>${f.sitio.h240.toLocaleString(idioma)} m · ${f.sitio.pend240}° <small>· ${t('base480')}</small></dd>` : ''}
    ${filasCielo(lat, lon, f.sitio?.id)}</dl>${nota}${acciones}`
  F.classList.add('vis')
  if (!refrescar) tamano()
}
/** 190 km sobre la estereográfica polar (2·R·tan(c/2), R = 1737,4 km) son 6,26° de colatitud. */
const LAT_PLANIFICADOR = -83.74
/** Abre el punto de la ficha en el planificador (`/planner#…`, ver prototipos/lunar-map/index.html): el lugar por su id del catálogo si lo tiene, sus coordenadas y la fecha del mapa. */
function abrirEnPlanificador(f) {
  const lat = f.sitio ? f.sitio.lat : f.iau ? f.iau.lat : f.lat, lon = f.sitio ? f.sitio.lon : f.iau ? f.iau.lon : f.lon
  const q = new URLSearchParams({ lat: lat.toFixed(5), lon: (((lon % 360) + 360) % 360).toFixed(5), t: new Date(ahoraMs).toISOString().slice(0, 16) })
  if (f.sitio?.id) q.set('site', f.sitio.id)
  const nombre = f.sitio?.nombre ?? f.iau?.n
  if (nombre) q.set('name', nombre)   // el planificador lo muestra en lugar de «Own point»
  const url = '/planner#' + q
  try { window.top.location.href = url } catch { window.location.href = url }
}
$('ficha').addEventListener('click', (e) => {
  const acc = e.target.closest('[data-acc]')?.dataset.acc
  if (acc === 'plan' && fichaActual) abrirEnPlanificador(fichaActual)
  if (acc === 'cerrar') { $('ficha').classList.remove('vis'); iauSel = null; tamano(); fichaActual = null; seleccion = null; propio = null; SITIOS.forEach((x) => x.el.classList.remove('sel')); lista() }
  if (acc === 'ir') {
    if (fichaActual?.sitio) acercarProgresivo(fichaActual.sitio.lat, fichaActual.sitio.lon, fichaActual.sitio.lat < -78 ? 70 : 520)
    else if (fichaActual?.iau) acercarProgresivo(fichaActual.iau.lat, fichaActual.iau.lon, Math.min(Math.max(fichaActual.iau.d * 2.4, 25), 900))
    else if (fichaActual) acercarProgresivo(fichaActual.lat, fichaActual.lon, fichaActual.lat < -78 ? 45 : 260)
  }
})

// Clic sobre el relieve: rayo contra la superficie exagerada (iterando la altura).
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2()
function picar(ev) {
  const r = lienzo.getBoundingClientRect()
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1)
  ray.setFromCamera(ndc, camera)
  const o = ray.ray.origin, d = ray.ray.direction
  let rad = R, punto = null
  for (let it = 0; it < 8; it++) {
    const b = o.dot(d), c = o.dot(o) - rad * rad, disc = b * b - c
    if (disc < 0) return null
    const tt = -b - Math.sqrt(disc)
    if (tt < 0) return null
    punto = o.clone().addScaledVector(d, tt)
    const [la, lo] = deVector(punto)
    rad = R + altura(la, lo).h * exag
  }
  return deVector(punto)
}
let abajo = null
lienzo.addEventListener('pointerdown', (e) => { abajo = [e.clientX, e.clientY] })
lienzo.addEventListener('pointerup', (e) => {
  if (!abajo || Math.hypot(e.clientX - abajo[0], e.clientY - abajo[1]) > 5) return
  const ll = picar(e)
  if (!ll) return
  seleccion = null; SITIOS.forEach((x) => x.el.classList.remove('sel'))
  propio = { lat: ll[0], lon: ll[1], pos: unit(ll[0], ll[1]).multiplyScalar(R + altura(ll[0], ll[1]).h * exag + 0.05) }
  mostrarFicha({ lat: ll[0], lon: ll[1] })
  lista()
})

$('vistas').addEventListener('click', (e) => {
  const v = e.target.closest('button')?.dataset.vista
  if (!v) return
  vista = v; seg('vistas', 'vista', v); estado()
  if (v === 'polo') { modoLuz = 'sol'; seg('luces', 'luz', 'sol'); fijarExag(2); irPolo() }
  else { fijarExag(6); irGlobo() }
})
$('chips').addEventListener('click', (e) => {
  const c = e.target.closest('[data-cat]')?.dataset.cat
  if (!c) return
  filtro.cats.has(c) ? filtro.cats.delete(c) : filtro.cats.add(c)
  chips(); lista()
})
$('agencia').addEventListener('change', (e) => { filtro.agencia = e.target.value; lista() })
$('anio').addEventListener('input', (e) => { filtro.anio = +e.target.value; $('anioV').textContent = filtro.anio; lista() })
$('buscar').addEventListener('input', (e) => { filtro.texto = e.target.value.trim().toLowerCase(); lista() })
$('lista').addEventListener('click', (e) => { const id = e.target.closest('[data-id]')?.dataset.id; if (id) seleccionar(SITIOS.find((s) => s.id === id), true) })
$('colores').addEventListener('click', (e) => { const c = e.target.closest('button')?.dataset.color; if (c) { modoColor = c; seg('colores', 'color', c); pintar() } })
$('luces').addEventListener('click', (e) => { const l = e.target.closest('button')?.dataset.luz; if (l) { modoLuz = l; seg('luces', 'luz', l); pedir(true) } })
function fijarExag(v) { exag = v; $('exag').value = v; $('exagV').textContent = '×' + v; $('exag').title = t('exagNota'); construirRelieve() }
$('exag').addEventListener('input', (e) => { $('exagV').textContent = '×' + e.target.value })
$('exag').addEventListener('change', (e) => {
  const prev = exag; fijarExag(+e.target.value)
  // Mantener el objetivo sobre la superficie al cambiar la exageración.
  if (controls.target.lengthSq() > 1) {
    const [la, lo] = deVector(controls.target), h = altura(la, lo).h, delta = h * (exag - prev)
    const up = controls.target.clone().normalize()
    controls.target.addScaledVector(up, delta); camera.position.addScaledVector(up, delta)
  }
  if (propio) propio.pos = unit(propio.lat, propio.lon).multiplyScalar(R + altura(propio.lat, propio.lon).h * exag + 0.05)
})
// ---------------------------------------------------------------- tooltips
const TIPS = {
  es: {
    albedo: ['Albedo', 'Colorea el suelo según su brillo real, medido por el láser LOLA a 1064 nm. Los mares oscuros son basalto; las tierras altas claras, anortosita.'],
    altura: ['Altura', 'Colorea por elevación sobre la esfera de 1737,4 km: azul en las depresiones (hasta −9 km) y crema en las cumbres (hasta +10,5 km).'],
    pendiente: ['Pendiente', 'Inclinación del terreno en grados: crema por debajo de 5°, amarillo y naranja hasta 15°, rojo por encima. El color usa 663 m en el polo y 7,6 km en el resto; la ficha mide a 240 m cerca del polo. Ninguna escala ve rocas ni cráteres pequeños.'],
    iau: ['Nombres IAU', '8876 nombres oficiales de la Unión Astronómica Internacional: cráteres, mares y montes. Cada uno aparece cuando su tamaño en pantalla es suficiente; acércate para ver más. Clic en un nombre para conocer su origen.'],
    exag: ['Exageración vertical', 'Multiplica solo las alturas del dibujo. La Luna es muy lisa: la montaña más alta mide el 0,6 % del radio, y a ×1 el globo entero parece una bola pulida.',
      '<b>×1 es la escala real</b>: úsalo de cerca y siempre que mires sombras, porque exagerar las alarga. <b>×5 a ×8</b> para ver el globo entero. Las cifras de la ficha usan siempre alturas reales.'],
    sol: ['Sol real', 'Ilumina con la posición verdadera del Sol en la fecha elegida (JPL Horizons). Muestra el día, la noche y las sombras reales: en el polo, el Sol roza el horizonte y el fondo de Shackleton queda negro.'],
    camara: ['Luz de estudio', 'Luz fija que sale junto a la cámara, para leer el relieve en cualquier lugar, de día o de noche. No corresponde a ninguna fecha: no sirve para juzgar la iluminación.'],
  },
  en: {
    albedo: ['Albedo', 'Colors the ground by its real brightness, measured by the LOLA laser at 1064 nm. Dark maria are basalt; bright highlands are anorthosite.'],
    altura: ['Elevation', 'Colors by height above the 1737.4 km sphere: blue in depressions (down to −9 km), cream on peaks (up to +10.5 km).'],
    pendiente: ['Slope', 'Terrain tilt in degrees: cream below 5°, yellow and orange up to 15°, red above. Colors use 663 m near the pole and 7.6 km elsewhere; the card measures at 240 m near the pole. No scale resolves boulders or small craters.'],
    iau: ['IAU names', '8,876 official names from the International Astronomical Union: craters, maria and montes. Each appears once it is large enough on screen; zoom in to see more. Click a name to read its origin.'],
    exag: ['Vertical exaggeration', 'Multiplies only the drawn heights. The Moon is very smooth: its highest mountain is 0.6 % of the radius, so at ×1 the whole globe looks polished.',
      '<b>×1 is true scale</b>: use it up close and whenever you read shadows, because exaggeration lengthens them. <b>×5 to ×8</b> to view the whole globe. Card figures always use real heights.'],
    sol: ['Real Sun', 'Lights the Moon with the true Sun position on the chosen date (JPL Horizons). Shows day, night and real shadows: at the pole the Sun grazes the horizon and Shackleton\'s floor stays black.'],
    camara: ['Studio light', 'A fixed light next to the camera, to read the relief anywhere, day or night. It matches no date, so it cannot be used to judge lighting.'],
  },
}
function estadoExag(v = exag) {
  const alt = camera.position.length() - R
  const es = idioma === 'es'
  if (v === 1) return es ? 'Ahora ×1: escala real.' : 'Now ×1: true scale.'
  if (alt < 400 && v > 2) return es ? `Ahora ×${v}, y estás cerca: conviene ×1 o ×2.` : `Now ×${v} and you are close: ×1 or ×2 works better.`
  return es ? `Ahora ×${v}: bien para leer la forma del terreno desde lejos.` : `Now ×${v}: good for reading terrain shape from afar.`
}
const tip = document.createElement('div')
tip.id = 'tip'; tip.setAttribute('role', 'tooltip')
tip.innerHTML = '<span class="estela"></span><span class="astro"></span><div class="carta"></div>'
document.body.appendChild(tip)
document.querySelector('[data-color=albedo]').dataset.tip = 'albedo'
document.querySelector('[data-color=altura]').dataset.tip = 'altura'
document.querySelector('[data-color=pendiente]').dataset.tip = 'pendiente'
document.querySelector('#exag').closest('label').dataset.tip = 'exag'
document.querySelector('#iau').dataset.tip = 'iau'
document.querySelector('[data-luz=sol]').dataset.tip = 'sol'
document.querySelector('[data-luz=camara]').dataset.tip = 'camara'
let tipDe = null, tipTimer = 0
function mostrarTip(el) {
  const k = el.dataset.tip, [titulo, texto, mejor] = TIPS[idioma][k]
  tip.querySelector('.carta').innerHTML = `<strong>${titulo}</strong><p>${texto}</p>${mejor ? `<p class="mejor">${mejor}</p>` : ''}${k === 'exag' ? `<p class="ahora">${estadoExag()}</p>` : ''}`
  if (tipDe !== el) { tip.classList.remove('vis'); void tip.offsetWidth }
  tipDe = el
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, m = 14
  const borde = (el.closest(".ctrl") ?? el).getBoundingClientRect()
  let x = borde.left - tw - m, y = r.top
  if (x < 12) { x = Math.min(Math.max(12, r.left + r.width / 2 - tw / 2), innerWidth - tw - 12); y = r.bottom + m }
  y = Math.min(Math.max(12, y), innerHeight - th - 12)
  tip.style.left = x + "px"; tip.style.top = y + "px"
  tip.classList.add('vis')
  el.setAttribute('aria-describedby', 'tip')
}
function ocultarTip() { clearTimeout(tipTimer); tip.classList.remove('vis'); tipDe?.removeAttribute('aria-describedby'); tipDe = null }
document.querySelectorAll('[data-tip]').forEach((el) => {
  el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { clearTimeout(tipTimer); tipTimer = setTimeout(() => mostrarTip(el), 120) } })
  el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') ocultarTip() })
  el.addEventListener('focusin', () => { if (el.matches(':focus-visible') || el.querySelector(':focus-visible')) mostrarTip(el) })
  el.addEventListener('focusout', ocultarTip)
  // En pantallas táctiles: al tocar, la explicación se queda 4 s.
  el.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') { mostrarTip(el); clearTimeout(tipTimer); tipTimer = setTimeout(ocultarTip, 4000) } })
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ocultarTip() })
$('exag').addEventListener('input', () => { const a = tip.querySelector('.ahora'); if (tipDe?.dataset.tip === 'exag' && a) a.textContent = estadoExag(+$('exag').value) })
$('iau').addEventListener('click', () => { capaIAU = !capaIAU; $('iau').setAttribute('aria-pressed', capaIAU); pedir() })
$('abrirPanel').addEventListener('click', () => $('panel').classList.toggle('abierto'))

let velocidad = 21600, jugando = false, ultimo = 0
$('velocidad').addEventListener('click', (e) => { const v = e.target.closest('button')?.dataset.vel; if (v) { velocidad = +v; seg('velocidad', 'vel', v) } })
$('play').addEventListener('click', () => { jugando = !jugando; $('play').textContent = jugando ? '❚❚' : '▶'; if (jugando && modoLuz !== 'sol') { modoLuz = 'sol'; seg('luces', 'luz', 'sol') } ultimo = performance.now(); pedir() })
fechaEl.min = new Date(EPH0).toISOString().slice(0, 16)
fechaEl.max = new Date(EPH0 + (EPHN - 1) * EPHPASO).toISOString().slice(0, 16)
fechaEl.addEventListener('change', () => { const ms = Date.parse(fechaEl.value + ':00Z'); if (!isNaN(ms)) { ahoraMs = ms; actualizarTiempo() } })

// ---------------------------------------------------------------- bucle (render bajo demanda)
let pendiente_ = true, sombraSucia = true, fichaTick = 0
function pedir(sombra) { pendiente_ = true; if (sombra) sombraSucia = true }
controls.addEventListener('change', () => pedir(true))
function tamano() {
  const w = escenaEl.clientWidth, h = escenaEl.clientHeight
  renderer.setSize(w, h, false); camera.aspect = w / h
  // Con la ficha abierta a la derecha, el objetivo se centra en el espacio libre (no debajo de la ficha).
  escenaEl.classList.toggle('estrecha', w < 760)
  const F = $('ficha'), vis = F.classList.contains('vis'), barra = document.querySelector('.tiempo'), sup = document.querySelector('.vista-sup')
  F.style.bottom = (barra.offsetHeight + 24) + 'px'
  if (vis && w >= 760) camera.setViewOffset(w, h, (F.offsetWidth + 16) / 2, 0, w, h)
  else if (vis) { // centrar el objetivo entre los controles de arriba y la ficha
    const libreArriba = sup.offsetTop + sup.offsetHeight, libreAbajo = h - barra.offsetHeight - 24 - F.offsetHeight
    camera.setViewOffset(w, h, 0, Math.max(0, h / 2 - (libreArriba + libreAbajo) / 2), w, h)
  } else camera.clearViewOffset()
  camera.updateProjectionMatrix(); pedir()
}
new ResizeObserver(tamano).observe(escenaEl)
function cuadro(now) {
  requestAnimationFrame(cuadro)
  if (vuelo) {
    const u = Math.min(1, (now - vuelo.t0) / vuelo.ms), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2
    controls.target.lerpVectors(vuelo.o0, vuelo.o1, e)
    // Camino por fuera de la esfera: interpolar dirección y distancia por separado.
    const d0 = vuelo.p0.length(), d1 = vuelo.p1.length(), n0 = vuelo.p0.clone().normalize(), n1 = vuelo.p1.clone().normalize()
    const n = n0.lerp(n1, e).normalize(), dist = d0 + (d1 - d0) * e
    const sube = Math.sin(Math.PI * e) * Math.min(R * 0.6, vuelo.p0.distanceTo(vuelo.p1) * 0.25)
    camera.position.copy(n.multiplyScalar(Math.max(dist + sube, R + 1)))
    if (u >= 1) { camera.position.copy(vuelo.p1); vuelo = null }
    pedir(true)
  }
  if (jugando) {
    const dt = (now - ultimo) / 1000; ultimo = now
    ahoraMs += dt * velocidad * 1000
    if (ahoraMs > EPH0 + (EPHN - 1) * EPHPASO) ahoraMs = EPH0
    const e = ephEn(ahoraMs); if (e) { dirSol = e.sol; dirTierra = e.tierra }
    if (now - fichaTick > 400) { fichaTick = now; actualizarTiempo() }
    pedir(true)
  }
  const mov = controls.update()
  if (!pendiente_ && !mov) return
  pendiente_ = false
  // Planos de recorte según la distancia a la superficie.
  const alt = Math.max(camera.position.length() - R - 11 * exag, 0.5)
  camera.near = Math.max(0.005, alt * 0.02); camera.far = DIST_CIELO * 1.6; camera.updateProjectionMatrix()
  ajustarLuz()
  if (sombraSucia || modoLuz === 'camara') { renderer.shadowMap.needsUpdate = true; sombraSucia = false }
  renderer.render(scene, camera)
  proyectarMarcas()
}

// ---------------------------------------------------------------- inicio
seg('vistas', 'vista', vista); seg('colores', 'color', modoColor); seg('luces', 'luz', modoLuz); seg('velocidad', 'vel', velocidad)
$('anioV').textContent = filtro.anio
performance.mark('ui-lista')
fijarExag(6)
pintar()
textos()
tamano()
irGlobo(unit(10, 20))
cargaEl.remove()
requestAnimationFrame(cuadro)
// Tras el primer dibujo se baja el polo sur (~4 MB, prioridad baja).
requestAnimationFrame(() => requestAnimationFrame(() => { performance.mark('primer-dibujo'); cargarPolo().catch((e) => console.error(e)) }))
window.__mapa = { cargarPolo, get poloListo() { return poloListo }, THREE, renderer, ajustarLuz, proyectarMarcas, camera, controls, scene, SITIOS, IAU, altura, pendiente, alturaFina, pendienteFina, cielo, estereo, seleccionar, irPolo, irGlobo, set fecha(ms) { ahoraMs = ms; actualizarTiempo() } }
