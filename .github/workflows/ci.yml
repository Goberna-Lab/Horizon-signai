name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted a propósito: el repo es público y los PRs de forks
    # NUNCA deben correr en el runner self-hosted del VPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p apps/api
      - run: npm run build -w @horizon-signai/web
