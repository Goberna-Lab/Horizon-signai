name: deploy

# Producción: https://signal-horizon.goberna.us (VPS2, runner self-hosted dedicado).
# Solo dispara con el CI en verde sobre main, o a mano. Jamás por pull_request:
# el repo es público y este runner vive dentro del servidor.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-horizon-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, horizon-signai]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      DEPLOY_DIR: /srv/horizon-signai
      COMPOSE: docker-compose.prod.yml
      URL: https://signal-horizon.goberna.us
      GIT_TOKEN: ${{ github.token }}
    steps:
      # Sin cortes (deploy/README.md): la app corre en dos copias detrás del upstream de nginx
      # (app-a :7083 principal, app-b :7084 backup) y se actualizan de a una, cada una esperando
      # a estar sana. Mientras app-a se reemplaza, nginx atiende con app-b, que ya tiene la versión nueva.
      - name: Desplegar con verificación y rollback
        # IA en la nube: claves (secretos) y ajustes (variables) del repo, que pone scripts/configurar-ia-nube.sh.
        # Solo en este paso; GitHub las tapa en el log.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOZ_EDUCATIONAL: ${{ vars.ELEVENLABS_VOZ_EDUCATIONAL }}
          ELEVENLABS_VOZ_ASSISTANT: ${{ vars.ELEVENLABS_VOZ_ASSISTANT }}
          IA_MOTOR: ${{ vars.IA_MOTOR }}
          VOZ_MOTOR: ${{ vars.VOZ_MOTOR }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          dc() { docker compose -f "$COMPOSE" "$@"; }
          # Sube una copia con la imagen :latest y espera a que esté healthy. Si la imagen no cambió, no la toca.
          subir() { dc up -d --no-deps --wait --wait-timeout 120 "$1"; }

          if [ ! -d .git ]; then
            git init --quiet
            git remote add origin https://github.com/${{ github.repository }}.git
            ANTERIOR=""
          else
            ANTERIOR="$(git rev-parse HEAD)"
          fi
          git fetch --quiet "https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git" main
          git reset --hard --quiet FETCH_HEAD
          echo "· commit: $(git rev-parse --short HEAD)"

          # IA en la nube: lo que está en GitHub se escribe en ia-nube.env (600), que el compose suma al .env de la
          # app. Se reescribe en cada deploy, solo con lo que tiene valor: lo que se borra en GitHub deja de estar.
          # Está en .dockerignore: nunca entra en la imagen.
          (
            umask 077
            : >ia-nube.env.nuevo
            for v in ANTHROPIC_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOZ_EDUCATIONAL ELEVENLABS_VOZ_ASSISTANT IA_MOTOR VOZ_MOTOR; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >>ia-nube.env.nuevo; fi
            done
            mv ia-nube.env.nuevo ia-nube.env
          )
          echo "· IA en la nube: $(cut -d= -f1 ia-nube.env | tr '\n' ' ')"

          # La imagen que está en producción queda como :anterior para volver sin reconstruir.
          HAY_ANTERIOR=0
          if docker image inspect horizon-signai:latest >/dev/null 2>&1; then
            docker tag horizon-signai:latest horizon-signai:anterior
            HAY_ANTERIOR=1
          fi

          volver() {
            echo "✖ $1"
            if [ "$HAY_ANTERIOR" -eq 1 ]; then
              docker tag horizon-signai:anterior horizon-signai:latest
              # app-a primero: si quedó con la versión rota, nginx atiende con app-b mientras se reemplaza.
              # Con el compose de este commit (no el anterior), que es el que conoce app-a y app-b.
              if subir app-a && subir app-b; then
                echo "· la app volvió a la imagen anterior"
              else
                echo "✖ tampoco levantó la imagen anterior: revisar a mano (docker compose -f $COMPOSE ps)"
              fi
            fi
            [ -n "$ANTERIOR" ] && git reset --hard --quiet "$ANTERIOR" && echo "· código vuelto a $ANTERIOR"
            exit 1
          }

          # Se construye con las dos copias viejas atendiendo.
          dc build app-a db-loader || volver "falló el build"

          # Migraciones y carga del mapa 3D, también con la app vieja atendiendo: por eso cada migración
          # tiene que servirle a la versión anterior (db/README.md). La carga va en una sola transacción.
          dc up -d --wait db || volver "la base no quedó healthy"
          dc up --no-deps --exit-code-from db-loader db-loader || volver "falló db-loader (migración o carga)"

          # app-b es el backup de nginx y en uso normal no recibe tráfico: se actualiza primero.
          subir app-b || { dc logs --tail 40 app-b || true; volver "app-b no llegó a healthy"; }

          # Paso del compose de una sola copia (servicio `app`) al de dos: libera :7083 con nginx
          # ya atendiendo con app-b. Solo actúa en el primer deploy; después no hay nada que hacer.
          if docker inspect horizon_signai_app >/dev/null 2>&1; then
            docker stop -t 130 horizon_signai_app && docker rm horizon_signai_app
          fi

          subir app-a || { dc logs --tail 40 app-a || true; volver "app-a no llegó a healthy"; }

          # Verificación pública: depende del DNS + certificado de signal-horizon.goberna.us
          OK=0
          for i in $(seq 1 10); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$URL/api/health" || echo 000)" = "200" ] && { OK=1; break; }
            sleep 3
          done
          [ "$OK" -eq 1 ] || volver "$URL/api/health no respondió 200"

          docker image prune -f >/dev/null 2>&1 || true
          echo "✔ deploy completo"
