# Dev database for the 3D Moon map: PostgreSQL 17 + PostGIS 3.5 (with postgis_raster) on host port 5433.
# Credentials come from the repo-root .env (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD).
name: horizon-signai-db
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: horizon_signai_db
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:${HORIZON_DB_PORT:-5433}:5432"
    volumes:
      - horizon_pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  horizon_pgdata:
