# Va en VPS2 como /etc/nginx/conf.d/horizon-signai-upstream.conf (contexto http). Ver deploy/README.md.
#
# app-a atiende todo; app-b solo recibe lo que app-a no pudo atender (mientras el deploy la reemplaza).
# max_fails=0: nginx nunca da una copia por caída durante un rato; prueba app-a en cada pedido y, si la
# conexión falla (rechazada al instante en loopback), pasa ese mismo pedido a app-b. Así, apenas app-a
# vuelve, vuelve a recibir todo, y nunca quedan las dos marcadas como caídas a la vez.
upstream horizon_signai {
    server 127.0.0.1:7083 max_fails=0;
    server 127.0.0.1:7084 max_fails=0 backup;
}
